name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v6
        with: { go-version: "1.25", cache: true }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          # Override GITHUB_TOKEN with a PAT that has contents:write on
          # grounds-cli + homebrew-tap + scoop-bucket so GoReleaser can
          # push the formula/manifest to the sibling repos. Falls back
          # to the default per-repo GITHUB_TOKEN if HOMEBREW_TAP_PAT is
          # missing — release artefacts still upload, but tap/bucket
          # publishing fails (acceptable degraded mode for a first
          # bring-up; reset HOMEBREW_TAP_PAT in repo settings to fix).
          GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT || secrets.GITHUB_TOKEN }}

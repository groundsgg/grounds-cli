version: 2

project_name: grounds-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: grounds
    main: ./cmd/grounds
    binary: grounds
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/groundsgg/grounds-cli/internal/version.Version={{.Version}}
      - -X github.com/groundsgg/grounds-cli/internal/version.Commit={{.ShortCommit}}
      - -X github.com/groundsgg/grounds-cli/internal/version.BuildAt={{.Date}}
      # GlitchTip DSN — public-key only, safe to embed (Sentry's
      # documented model: DSNs ship in client bundles).
      - -X github.com/groundsgg/grounds-cli/internal/observability.DSN=https://ea5b2e86-1c42-4a4c-a227-35c8d7652e2e@glitch.grounds.gg/1

archives:
  - id: archive
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

nfpms:
  - id: linux-pkg
    package_name: grounds
    vendor: Grounds
    homepage: https://grounds.gg
    maintainer: Grounds <ops@grounds.gg>
    description: Grounds Internal Developer Platform CLI
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin

brews:
  - repository:
      owner: groundsgg
      name: homebrew-tap
      # Sibling-repo push needs cross-repo write — use the PAT
      # exposed as HOMEBREW_TAP_PAT in the workflow.
      token: "{{ .Env.HOMEBREW_TAP_PAT }}"
    name: grounds
    homepage: https://grounds.gg
    description: Grounds Internal Developer Platform CLI
    license: Apache-2.0
    # Cask was the old setup; goreleaser wrote 0.1.10+ into Casks/
    # while the top-level Formula (where `brew install grounds/tap/grounds`
    # looks) stuck at 0.1.7. Formula is the conventional shape for a
    # CLI binary and lets users keep the formula install path.
    test: |
      assert_match "grounds version", shell_output("#{bin}/grounds version")

scoops:
  - repository:
      owner: groundsgg
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_PAT }}"
    homepage: https://grounds.gg
    description: Grounds Internal Developer Platform CLI
    license: Apache-2.0

release:
  github:
    owner: groundsgg
    name: grounds-cli

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
